# Every pull request and every push to main: types, lint, tests, the server against real services, a secret scan.
# No secret is used here, so pull requests from forks run the same checks (repo-and-secrets).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: slopesque, POSTGRES_PASSWORD: dev-only-postgres, POSTGRES_DB: slopesque }
        ports: ['23432:5432']
        options: --health-cmd "pg_isready -U slopesque" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['23379:6379']
      rustfs:
        image: rustfs/rustfs:1.0.6
        env: { RUSTFS_ACCESS_KEY: slopesque, RUSTFS_SECRET_KEY: dev-only-rustfs-secret, RUSTFS_VOLUMES: /data }
        ports: ['23900:9000']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - name: The server starts and every service answers
        run: |
          (cd apps/server && node dist/main.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:23100/api/health > health.json && break; sleep 1; done
          cat health.json || { cat server.log; exit 1; }
          node -e "const h=require('./health.json'); const s=h.services; if (s.postgres!=='ok'||s.redis!=='ok'||s.storage!=='ok') { console.error('service down', s); process.exit(1); }"
      - name: Secret scan (gitleaks, whole history)
        run: node tools/scan-secrets.mjs

  e2e:
    # two players with the built extension (Chromium) against the built server and its services
    runs-on: ubuntu-26.04
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: slopesque, POSTGRES_PASSWORD: dev-only-postgres, POSTGRES_DB: slopesque }
        ports: ['23432:5432']
        options: --health-cmd "pg_isready -U slopesque" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['23379:6379']
      rustfs:
        image: rustfs/rustfs:1.0.6
        env: { RUSTFS_ACCESS_KEY: slopesque, RUSTFS_SECRET_KEY: dev-only-rustfs-secret, RUSTFS_VOLUMES: /data }
        ports: ['23900:9000']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @slopesque/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @slopesque/e2e e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: tests/e2e/shots/
